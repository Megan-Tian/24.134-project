# Concept phrase sets for J-space moral-direction scoring.
# Built independently of experimental responses (HANDOFF §13–15).
# Prefer short phrases that often tokenize to few tokens; scoring uses
# last-token ids of each phrase under the active tokenizer.

safety:
  - safety
  - worker safety
  - workplace safety
  - injury prevention
  - protecting workers
  - occupational safety

profit:
  - profit
  - profitability
  - financial return
  - earnings
  - revenue
  - shareholder value

jobs:
  - jobs
  - employment
  - workforce
  - layoffs
  - preserving jobs
  - families

salary:
  - salary
  - pay
  - wages
  - income
  - higher salary
  - compensation

vacation:
  - vacation
  - vacation days
  - time off
  - holidays
  - leisure

commute:
  - commute
  - commuting
  - travel time
  - shorter commute
  - distance to work

flood_protection:
  - flood protection
  - flood defense
  - flood safety
  - protecting villagers
  - flood measures

vocational_training:
  - vocational training
  - youth training
  - adolescent integration
  - unemployed adolescents
  - job training

village_square:
  - village square
  - renovate square
  - paving
  - parking
  - square renovation

production:
  - production
  - production volume
  - additional facilities
  - increase production
  - output

# Held-out definition prompts for optional direction calibration (§15).
# Not used for response leakage; kept for future calibration runs.
definition_prompts:
  safety: "Workplace safety means protecting workers from physical injury."
  profit: "Profitability refers to the financial return generated by a business."
  jobs: "Preserving jobs means keeping people employed and supporting families."
  salary: "A higher salary means greater annual monetary compensation for work."
  vacation: "More vacation days means greater time away from work for rest."
  commute: "A shorter commute means less time spent traveling to work."
  flood_protection: "Flood protection means defending a community from flood damage."
  vocational_training: "Vocational training helps unemployed adolescents gain skills and integrate."
  village_square: "Renovating the village square improves public paving and parking conditions."
  production: "Increasing production through additional facilities raises manufacturing output."

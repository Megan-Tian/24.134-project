[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "moral-coherence"
version = "0.1.0"
description = "J-space / output moral coherence experiment pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers>=5.5",
    "huggingface_hub",
    "numpy",
    "pyyaml",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

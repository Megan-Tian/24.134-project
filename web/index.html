    <template id="tpl-home">
      <section class="intro">
        <h1>Does a Large Language Model's <em>internal states</em> agree with the moral choice it makes?</h1>
        <p>
          Each experiment presents the model an ethical dilemma between two competing values.
          Choose an experiment card below, then advance the model's response token by token. As it writes,
          the <a href="https://www.anthropic.com/research/global-workspace">J-space</a> readout shows what each layer's internal
          representation is "leaning toward" so you
          can watch whether the model's private reasoning tracks the answer it
          eventually outputs.
        </p>

        <h2>So what?</h2>
        <p>
          Our experiments test whether the LLM "agrees with itself" both in the final output
          and during its internal reasoning. We find that in some conditions, for example experiment 
          1's tragic trade-off between investing in workplace safety vs preserving jobs, the LLM's
          internal reasoning agrees with its output less than half the time.
        </p>

        <p>
          The experiment cards cover a range of scenarios: routine, taboo, and tragic. These scenarios
          measure response to tradeoffs between sacred and secular/non-sacred values. Sacred values 
          like health, love, justice, or human rights are seen as inviolable, hence sacred. Secular values
          can be thought of as "everything else" where chosing one over a sacred value can be considered
          taboo (ie. chosing money over human rights). Before viewing the LLM response, reason through
          the dilemma yourself. Identify what values you would prioritize and then compare to the LLM response. 
        </p>

        <p>
          These experiments do not imply that LLMs lack some some sort of fundamental value system, 
          rather, they highlight that LLMs do not reliably exhibit the type of consistent, 
          value-based reasoning one might expect from a human advice-giver. This matters because as
          people are increasingly turning to LLMs for personal and ethical advice, AI developers,
          researchers, and ordinary users need understand the current limitations of these systems to 
          use and develop the technology responsibly. 
        </p>

        <p>
          Simuli for all experiments are from Hanselmann and Tanner (2008) "Taboos and conflicts in 
          decision making: Sacred values, decision difficulty, and emotions".
        </p>
      </section>
      <div class="card-grid" id="card-grid"></div>
    </template>
